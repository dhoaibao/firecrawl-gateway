name: Bug report
description: Report a reproducible problem with the gateway or admin dashboard.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. For security vulnerabilities, do not use a public issue; follow [SECURITY.md](https://github.com/dhoaibao/firecrawl-gateway/blob/main/SECURITY.md).

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and its impact.
      placeholder: Tell us what went wrong.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest set of steps or request details that reproduces the problem. Remove all secrets and private data.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include a redacted error message if useful.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the relevant Bun, Node.js, deployment, and browser versions.
      placeholder: Bun 1.3.x, Node.js 22.x, Docker, ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste redacted logs only. Never include credentials, API keys, cookies, customer data, or private URLs.
      render: shell

  - type: checkboxes
    id: hygiene
    attributes:
      label: Safety check
      options:
        - label: I have removed secrets and private or customer data from this report.
          required: true
