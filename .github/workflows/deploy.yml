name: Deploy to Server

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "deploy/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - "docker-compose.prebuilt.yaml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Temporarily disabled. Remove these guards to re-enable deployments.
jobs:
  build:
    if: ${{ false }}
    name: Build and Push Gateway Image
    runs-on: ubuntu-latest
    environment: Hetzner
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: dhoaibao/firecrawl-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: ${{ false }}
    name: Deploy Firecrawl Stack
    runs-on: ubuntu-latest
    needs: build
    environment: Hetzner
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add server to known hosts
        run: |
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Create deploy directory
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} -p ${{ secrets.SSH_PORT }} \
            "mkdir -p ${{ vars.DEPLOY_PATH }}"

      - name: Copy compose file to server
        run: |
          scp -P ${{ secrets.SSH_PORT }} docker-compose.prebuilt.yaml \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ vars.DEPLOY_PATH }}/docker-compose.prebuilt.yaml

      - name: Deploy via SSH
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} -p ${{ secrets.SSH_PORT }} << 'EOF'
          set -e
          cd ${{ vars.DEPLOY_PATH }}

          # Update .env file with secrets
          rm -f .env
          cat > .env << 'ENDFILE'
          ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          BULL_AUTH_KEY=${{ secrets.BULL_AUTH_KEY }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          DATABASE_URL=postgresql://postgres:${{ secrets.POSTGRES_PASSWORD }}@nuq-postgres:5432/postgres
          PROXY_SERVER=${{ secrets.PROXY_SERVER }}
          PROXY_USERNAME=${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD=${{ secrets.PROXY_PASSWORD }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL=${{ secrets.OPENAI_BASE_URL }}
          MODEL_NAME=${{ secrets.MODEL_NAME }}
          ENDFILE
          chmod 600 .env

          docker compose -f docker-compose.prebuilt.yaml pull
          docker compose -f docker-compose.prebuilt.yaml up -d --force-recreate --remove-orphans
          docker image prune -f

          echo "Deploy completed successfully"
          EOF
