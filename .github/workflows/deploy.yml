name: CI

# Runs the repository's checks for pull requests. docker-publish.yml reuses this
# workflow on pushes to main and will not build or deploy unless it passes.

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # Bun runs the scripts, but Vitest and the Docker images use Node, pinned to the
      # version production runs (engines "22.x").
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # Catches a broken Compose file on the pull request instead of during the deploy.
      # Placeholders stand in for the values the server provides; nothing is started.
      - name: Validate Compose files
        run: |
          cp deploy/gateway/.env.example deploy/gateway/.env
          IMAGE_PREFIX=ghcr.io/example/firecrawl-gateway IMAGE_TAG=ci POSTGRES_PASSWORD=ci \
            docker compose -f deploy/gateway/docker-compose.yml config --quiet
          docker compose -f deploy/firecrawl/docker-compose.yml \
            --env-file deploy/firecrawl/.env.example config --quiet
