name: Release and deploy gateway

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable image tag (defaults to the commit SHA)
        required: false
        type: string
      rollback_image:
        description: Optional previous immutable image reference for a rollback rehearsal
        required: false
        type: string

permissions:
  contents: read

jobs:
  image:
    name: Build and publish immutable image
    runs-on: ubuntu-latest
    environment: production
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: dhoaibao/firecrawl-gateway:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy, migrate, smoke-test, and optionally rehearse rollback
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Install the pinned Compose topology
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" -p "${{ secrets.SSH_PORT }}" \
            "mkdir -p '${{ vars.DEPLOY_PATH }}'"
          scp -P "${{ secrets.SSH_PORT }}" docker-compose.prebuilt.yaml \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ vars.DEPLOY_PATH }}/docker-compose.prebuilt.yaml"

      - name: Backup, preflight, migrate, deploy, and smoke-test
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          BACKUP_PATH: ${{ vars.BACKUP_PATH || './backups' }}
          GATEWAY_IMAGE: dhoaibao/firecrawl-gateway@${{ needs.image.outputs.digest }}
          ROLLBACK_IMAGE: ${{ inputs.rollback_image }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: DEPLOY_PATH,BACKUP_PATH,GATEWAY_IMAGE,ROLLBACK_IMAGE
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            test -f .env
            mkdir -p "$BACKUP_PATH"
            backup_name="gateway-$(date -u +%Y%m%dT%H%M%SZ).dump"
            docker run --rm --env-file .env -e BACKUP_NAME="$backup_name" \
              -v "$BACKUP_PATH:/backup" postgres:17-alpine \
              sh -c 'pg_dump --format=custom --file="/backup/$BACKUP_NAME" "$MIGRATION_DATABASE_URL"'
            test -s "$BACKUP_PATH/$backup_name"
            restore_container="gateway-restore-$(date -u +%s)"
            cleanup_restore() {
              docker rm -f "$restore_container" >/dev/null 2>&1 || true
            }
            trap cleanup_restore EXIT
            docker run -d --name "$restore_container" \
              -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17-alpine >/dev/null
            until docker exec "$restore_container" pg_isready -U postgres -d postgres >/dev/null 2>&1; do
              sleep 2
            done
            docker run --rm --network "container:$restore_container" \
              -v "$BACKUP_PATH:/backup:ro" postgres:17-alpine \
              pg_restore --no-owner --no-acl --exit-on-error \
              --dbname=postgresql://postgres@127.0.0.1:5432/postgres \
              "/backup/$backup_name"
            docker exec "$restore_container" pg_isready -U postgres -d postgres >/dev/null
            cleanup_restore
            trap - EXIT

            wait_for_url() {
              url="$1"
              for _ in $(seq 1 30); do
                if curl --fail --silent --show-error "$url" >/dev/null; then return 0; fi
                sleep 2
              done
              return 1
            }
            wait_for_worker() {
              worker_id="$(docker compose --env-file .env -f docker-compose.prebuilt.yaml ps -q worker)"
              test -n "$worker_id"
              for _ in $(seq 1 30); do
                if [ "$(docker inspect --format '{{.State.Health.Status}}' "$worker_id")" = "healthy" ]; then return 0; fi
                sleep 2
              done
              return 1
            }

            docker compose --env-file .env -f docker-compose.prebuilt.yaml config --quiet
            MIGRATION_BACKUP_CONFIRMED=true docker compose --env-file .env \
              -f docker-compose.prebuilt.yaml run --rm --no-deps preflight
            docker compose --env-file .env -f docker-compose.prebuilt.yaml pull preflight migrate api worker
            docker compose --env-file .env -f docker-compose.prebuilt.yaml run --rm --no-deps migrate
            docker compose --env-file .env -f docker-compose.prebuilt.yaml up -d --force-recreate --no-deps api worker
            wait_for_url http://127.0.0.1:8080/health
            wait_for_url http://127.0.0.1:8080/ready
            wait_for_worker

            if [ -n "$ROLLBACK_IMAGE" ]; then
              GATEWAY_IMAGE="$ROLLBACK_IMAGE" docker compose --env-file .env \
                -f docker-compose.prebuilt.yaml up -d --force-recreate --no-deps api worker
              wait_for_url http://127.0.0.1:8080/ready
              wait_for_worker
              GATEWAY_IMAGE="$GATEWAY_IMAGE" docker compose --env-file .env \
                -f docker-compose.prebuilt.yaml up -d --force-recreate --no-deps api worker
              wait_for_url http://127.0.0.1:8080/ready
              wait_for_worker
            fi
