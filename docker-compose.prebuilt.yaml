name: firecrawl-gateway

services:
  gateway:
    image: dhoaibao/firecrawl-gateway:latest
    restart: unless-stopped
    environment:
      PORT: 8080
      GATEWAY_REQUEST_TIMEOUT_MS: ${GATEWAY_REQUEST_TIMEOUT_MS:-120000}
      GATEWAY_LOG_FILE: /data/hybrid-firecrawl-requests.jsonl
      GATEWAY_MAX_BODY_BYTES: ${GATEWAY_MAX_BODY_BYTES:-5242880}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to an externally hosted PostgreSQL database}
      OPERATOR_DATABASE_URL: ${OPERATOR_DATABASE_URL:?Set OPERATOR_DATABASE_URL to a separate operator database credential}
      SESSION_SECRET: ${SESSION_SECRET}
      FIRECRAWL_KEYS_ENCRYPTION_KEY: ${FIRECRAWL_KEYS_ENCRYPTION_KEY:?Set FIRECRAWL_KEYS_ENCRYPTION_KEY to a 64-character hex key}
      SESSION_SECURE: ${SESSION_SECURE}
      CORS_ORIGIN: ${CORS_ORIGIN}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - gateway-data:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
        compress: "true"

volumes:
  gateway-data:
