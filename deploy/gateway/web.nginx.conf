# Serves the admin SPA and reverse-proxies the gateway API paths so the browser
# talks to a single origin. Built into the `web` image (see ../../Dockerfile).
# Listens on 8080 (unprivileged nginx); the host nginx terminates TLS in front.

# OAuth authorization codes arrive in the query string of the portal sign-in
# callback; keep them out of the access log.
map $request_uri $logged_uri {
    ~^(/portal/api/auth/[^?]*)\? "$1?[redacted]";
    default $request_uri;
}

log_format gateway '$remote_addr - [$time_local] "$request_method $logged_uri $server_protocol" '
                   '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 8080;
    access_log /var/log/nginx/access.log gateway;
    root /usr/share/nginx/html;

    # Matches API_MAX_BODY_BYTES (5 MiB default).
    client_max_body_size 5m;

    # Docker's embedded DNS. A variable in proxy_pass makes nginx re-resolve the
    # gateway container, so a recreated container does not leave a stale IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ ^/(admin/api|portal/api|v1|v2|health|ready)(/|$) {
        set $gateway http://gateway:8080;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # The host nginx overwrites X-Forwarded-For with the real client address;
        # this hop appends to it. Run the API with TRUST_PROXY=true.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Streamed upstream responses; the API times out upstream calls at 120 s.
        proxy_buffering off;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
