# Serves the customer portal SPA and nothing else: no API proxying. The portal calls
# the gateway API on its own origin (PORTAL_API_BASE_URL, see 40-portal-config.sh), so
# routing between the portal, the API and the admin is up to the host in front of this
# container. Built into the `portal` image (see ../../Dockerfile). Listens on 8080
# (unprivileged nginx); the host nginx terminates TLS in front.

server {
    listen 8080;
    root /usr/share/nginx/html;

    # Runtime settings written by the entrypoint script; never cached.
    location = /config.js {
        alias /tmp/portal-config.js;
        default_type application/javascript;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Single-page app: unknown paths fall back to the shell. The portal creates and shows
    # API keys, so it must not be framed.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
    }
}
