# Serves the static landing page and nothing else. Built into the `landing` image (see
# ../../Dockerfile); the site root is /tmp/site, which 40-landing-config.sh fills from the
# built files at container start. Listens on 8080 (unprivileged nginx); the host nginx
# terminates TLS in front.

server {
    listen 8080;
    root /tmp/site;

    # Astro fingerprints everything under /_astro/.
    location /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }
}
